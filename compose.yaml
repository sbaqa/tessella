# Tessella with its own model server, on one machine. Run from your project folder:
#
#   docker compose build
#   docker compose up -d ollama queue          # model server + review queue on 127.0.0.1:8484
#   docker compose run --rm triage             # triage, with no route to the internet
#
# Models: Ollama reads them from TESSELLA_MODELS (default ./.tessella/models, where
# `tessella init` and `tessella install --from` put them). It cannot download anything:
# it sits on a network with no way out. Bring models in with a bundle (tessella bundle).
#
# Files the containers write in your project belong to TESSELLA_UID:TESSELLA_GID, so run
# with your own ids: export TESSELLA_UID=$(id -u) TESSELLA_GID=$(id -g)
#
# Your tessella.yaml is used as it is. Triage shares the model server's network, so the
# project server's address (base_url http://127.0.0.1:11435, the default) reaches it and
# network.allow needs no change. A config on another port: set TESSELLA_OLLAMA_PORT.
name: tessella

x-tessella: &tessella
  build: .
  image: tessella:0.1.0
  user: "${TESSELLA_UID:-10001}:${TESSELLA_GID:-10001}"
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  working_dir: /work
  volumes:
    - ./:/work   # reports, the repository, tessella.yaml, and .tessella/ (the store)

services:
  ollama:
    image: ollama/ollama:0.40.13@sha256:b2f0122c476bc9fe7ce679d8bb4bd555351e25e2554eefb156f61cb0a89cf429
    user: "${TESSELLA_UID:-10001}:${TESSELLA_GID:-10001}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      OLLAMA_HOST: "127.0.0.1:${TESSELLA_OLLAMA_PORT:-11435}"
      OLLAMA_MODELS: /models
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
      HOME: /tmp
    volumes:
      - ${TESSELLA_MODELS:-./.tessella/models}:/models
    tmpfs: [/tmp]
    networks: [models]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 30
    # GPU (NVIDIA Container Toolkit): uncomment.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  triage:
    <<: *tessella
    profiles: [run]
    network_mode: "service:ollama"   # no network of its own: loopback to the model server only
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      TESSELLA_OFFLINE: "1"          # and any connection attempt is refused and reported
      HOME: /tmp
    command: ["triage"]

  queue:
    <<: *tessella
    networks: [edge]                 # files approved tickets: Jira/GitHub via network.allow
    ports: ["127.0.0.1:8484:8484"]   # this machine only; see deploy/team for a shared queue
    environment:
      HOME: /tmp
    command: ["queue", "--host", "0.0.0.0", "--no-sign-in"]

networks:
  models:
    internal: true                   # no route to the internet
  edge: {}
