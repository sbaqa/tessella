name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[all,dev]"
      - run: pytest -q

  # Tessella on its own demo shop: the suite fails on purpose (planted bugs), a real local model
  # on this runner judges the failures, and the summary is posted on the pull request.
  demo-triage:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install -g allure-commandline
      - working-directory: examples/demo_shop
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          cp tessella.example.yaml tessella.yaml
          sed -i "s/allow: \[\"127/allow: [\"api.github.com\", \"${SMTP_HOST:-api.github.com}\", \"127/" tessella.yaml
      - working-directory: examples/demo_shop
        run: |
          bash run_suite.sh -q
          allure generate reports/allure-results -o reports/allure-single --single-file --clean
          cp reports/allure-single/index.html reports/allure-report.html
      - id: allure
        uses: actions/upload-artifact@v7
        with:
          path: examples/demo_shop/reports/allure-report.html
          archive: false
      - uses: ./
        with:
          working-directory: examples/demo_shop
          links: Allure report=${{ steps.allure.outputs.artifact-url }}
          email-to: ${{ vars.TESSELLA_EMAIL_TO }}
          smtp-host: ${{ vars.SMTP_HOST }}
          smtp-username: ${{ secrets.SMTP_USERNAME }}
          smtp-password: ${{ secrets.SMTP_PASSWORD }}
