[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tessella"
version = "0.1.0"
description = "Local quality investigator: explains why your tests failed and finds the bugs they missed, without data leaving your network."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
queue = ["fastapi>=0.111", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
html = ["selectolax>=0.3"]
vectors = ["sqlite-vec>=0.1"]
vision = ["pillow>=10.0"]
ocr = ["pillow>=10.0", "pytesseract>=0.3.10"]
mcp = ["mcp>=1.2"]  # `tessella mcp`: cases and evidence for coding assistants  # screenshot redaction; also needs the tesseract program
all = ["tessella[llm,queue,html,vectors,vision,mcp]"]
dev = ["pytest>=8.2", "respx>=0.21", "ruff>=0.5", "pillow>=10.0"]

[project.scripts]
tessella = "tessella.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tessella"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
